<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Такси кызматтары - Аксы</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; background-color: #f4f6f8; color: #333; }
        header { background-color: #008080; color: white; text-align: center; padding: 15px; }
        .container { padding: 15px; }
        .back-btn { display: inline-block; margin-bottom: 15px; color: #008080; text-decoration: none; font-weight: bold; }
        .driver-card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; }
        .driver-info h3 { margin: 0 0 5px 0; font-size: 16px; }
        .driver-info p { margin: 0; color: #666; font-size: 14px; }
        .buttons { display: flex; gap: 8px; }
        .btn { padding: 8px 12px; border-radius: 8px; text-decoration: none; color: white; font-weight: bold; font-size: 14px; }
        .call-btn { background-color: #2196F3; }
        .wa-btn { background-color: #25D366; }
    </style>
</head>
<body>
    <header><h2>🚕 ТАКСИ КЫЗМАТТАРЫ</h2></header>
    <div class="container">
        <a href="index.html" class="back-btn">⬅️ Артка кайтуу</a>
        <div class="driver-card">
            <div class="driver-info">
                <h3>Али (Аксы - Джалал-Абад)</h3>
                <p>Унаа: Спринтер, Күнүгө каттамда</p>
            </div>
            <div class="buttons">
                <a href="tel:+996555112233" class="btn call-btn">Чалуу</a>
                <a href="https://wa.me" class="btn wa-btn">WhatsApp</a>
            </div>
        </div>
    </div>
</body>
</html>
