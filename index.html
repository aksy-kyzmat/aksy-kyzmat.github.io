<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аксы Кызматтары</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f6f8;
            color: #333;
        }
        header {
            background-color: #008080;
            color: white;
            text-align: center;
            padding: 20px 10px;
        }
        header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1px;
        }
        header p {
            margin: 5px 0 0 0;
            font-size: 14px;
            opacity: 0.9;
        }
        .container {
            padding: 15px;
        }
        .welcome-text {
            font-size: 16px;
            text-align: center;
            margin-bottom: 20px;
            color: #555;
            font-weight: 500;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 20px 10px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            text-decoration: none;
            color: #333;
            font-weight: bold;
            font-size: 14px;
            border: 1px solid #eef0f2;
            transition: transform 0.1s;
        }
        .card:active {
            background-color: #e0f2f1;
            transform: scale(0.97);
        }
        .icon {
            font-size: 32px;
            margin-bottom: 8px;
            display: block;
        }
    </style>
</head>
<body>

    <header>
        <h1>АКСЫ КЫЗМАТТАРЫ</h1>
        <p>Бардык кызматтар бир жерде</p>
    </header>

    <div class="container">
        <p class="welcome-text">Керектүү категорияны тандаңыз:</p>
        
        <div class="grid">
            <a href="#" class="card">
                <span class="icon">🌱</span>
                Көчөттөр / Сатуу
            </a>
            <a href="#" class="card">
                <span class="icon">🎉</span>
                Той-топур кызматтары
            </a>
            <a href="#" class="card">
                <span class="icon">🚗</span>
                Авто кызматтары
            </a>
            <a href="#" class="card">
                <span class="icon">🛠️</span>
                Курулуш / Усталар
            </a>
            <a href="#" class="card">
                <span class="icon">🚕</span>
                Такси / Транспорт
            </a>
            <a href="#" class="card">
                <span class="icon">⚡</span>
                Электриктер
            </a>
            <a href="#" class="card">
                <span class="icon">🚰</span>
                Сантехниктер
            </a>
            <a href="#" class="card">
                <span class="icon">✂️</span>
                Сулуулук / Чач тарач
            </a>
        </div>
    </div>

</body>
</html>
